
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido de Namoro 💘</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #e91e63;
    }
    #botoes {
      margin-top: 30px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
    }
    #sim {
      background-color: #4CAF50;
      color: white;
    }
    #nao {
      background-color: #f44336;
      color: white;
      position: absolute;
    }
    #mensagem {
      margin-top: 30px;
      font-size: 24px;
      color: #ff1493;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Quer namorar comigo? 🥹❤️</h1>
  <div id="botoes">
    <button id="sim">Sim 💘</button>
    <button id="nao">Não 😢</button>
  </div>
  <div id="mensagem"></div>

  <script>
    const btnSim = document.getElementById("sim");
    const btnNao = document.getElementById("nao");
    const mensagem = document.getElementById("mensagem");

    btnSim.addEventListener("click", () => {
      mensagem.innerText = "EU TE AMOOOO 😍💖💍";
    });

    btnNao.addEventListener("mouseover", () => {
      const largura = window.innerWidth - btnNao.offsetWidth;
      const altura = window.innerHeight - btnNao.offsetHeight;
      const novaPosX = Math.random() * largura;
      const novaPosY = Math.random() * altura;
      btnNao.style.left = `${novaPosX}px`;
      btnNao.style.top = `${novaPosY}px`;
    });
  </script>
</body>
</html>
